<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="GKData — Evidence before inference">
<title>GKData — Evidence before inference</title>
<desc>GKData — Evidence before inference. Original static artwork for the Security Research Library.</desc>
<rect width="960" height="280" rx="16" fill="#141818"/>
<rect x="1" y="1" width="958" height="278" rx="15" fill="none" stroke="#353c38"/>
<text x="42" y="49" fill="#eeede5" font-family="Arial, sans-serif" font-size="18">GKDATA</text>
<text x="918" y="49" text-anchor="end" fill="#a9afa6" font-family="monospace" font-size="12">SECURITY RESEARCH LIBRARY</text>
<line x1="42" y1="70" x2="918" y2="70" stroke="#353c38"/>
<text x="42" y="131" fill="#eeede5" font-family="Arial, sans-serif" font-size="42">Evidence before inference.</text>
<text x="44" y="170" fill="#a9afa6" font-family="Arial, sans-serif" font-size="18">Public disclosures. Clear boundaries. Reusable knowledge.</text>
<line x1="42" y1="211" x2="918" y2="211" stroke="#353c38"/>
<text x="44" y="248" fill="#eeede5" font-family="monospace" font-size="12">READ THE SOURCE</text>
<text x="325" y="248" fill="#a9afa6" font-family="monospace" font-size="12">PRESERVE THE CONTEXT</text>
<text x="666" y="248" fill="#a9afa6" font-family="monospace" font-size="12">RESPECT THE BOUNDARY</text>
</svg>
