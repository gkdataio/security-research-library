<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(25.2 1003.2)">
<title>Fallbacks must preserve the original caller&#x27;s authority</title><desc>A failure retains the original caller, action and resource. An explicit access denial stops without protected data. A known recoverable operational failure can propose a fallback, but switching execution identity grants no extra caller entitlement. A separate application-policy decision evaluates that fallback for the original caller. Denied or indeterminate decisions stop without protected data. A permitted, scoped fallback returns only caller-permitted data.</desc>
<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-1003.2 827.2,-1003.2 827.2,25.2 -25.2,25.2"/>
