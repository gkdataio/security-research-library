name: Offline collection checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the revision under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # These checks use only the standard library and committed local files.
      # Do not run collectors, live change checks, regeneration, or publication here.
      - name: Validate canonical records
        run: |
          python scripts/validate.py
          python scripts/validate_extra.py
      - name: Run offline fixture tests
        run: python -m unittest discover -s tests -v
      - name: Check deterministic exports and navigation
        run: |
          python scripts/export_recognition.py --check
          python scripts/render_diagrams.py --check
          python scripts/export.py --check
          python scripts/export_resources.py --check
          python scripts/export_programs.py --check
          python scripts/export_program_discovery.py --check
          python scripts/export_public_bounties.py --check
          python scripts/export_bugcrowd_programs.py --check
          python scripts/export_scope_audit.py --check
          python scripts/build_navigation.py --check
          python scripts/render_readme_buttons.py --check
      - name: Verify checks left the checkout unchanged
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
